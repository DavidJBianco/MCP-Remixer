# Passthrough configuration for mcp-remixer
#
# This config simply proxies the MCP filesystem server with no modifications.
# Use this to compare against mcp-remixer.yaml to see the effect of hiding
# tools and adding custom ones.

upstreams:
  filesystem:
    transport: stdio
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "."]

# No hidden tools
hidden:
  tools: []

# No custom tools
custom_tools: []

# Audit logging disabled for passthrough demo
# Uncomment to enable:
# audit:
#   enabled: true
#   log_file: ./audit.jsonl
#   truncate: true
#   max_content_length: 1024
