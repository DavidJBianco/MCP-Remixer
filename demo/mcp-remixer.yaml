# Demo configuration for mcp-remixer
#
# This example proxies the MCP filesystem server, hides the write_file tool,
# and adds custom tools.

upstreams:
  filesystem:
    transport: stdio
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "."]

hidden:
  tools:
    - "write_file"  # Hide this tool - clients won't see or be able to call it

custom_tools:
  - "./tools/custom_tools.py"

# Audit logging - logs all MCP transactions to a JSON lines file
audit:
  enabled: true
  log_file: ./audit.jsonl
  truncate: true  # Recommended: truncate large fields to prevent unbounded log growth
  max_content_length: 1024  # Per-field limit in bytes
